# splat config for the boot ELF (v1.04). Splits the original ELF file by file
# offset: the ELF header/program headers and the trailing section tables are
# re-emitted verbatim from the user's copy (bin segments), so linking the
# pieces at their file offsets and objcopy -O binary reproduces the file.
name: SLPM_662.80 (Monster Hunter 2 v1.04 boot ELF)
sha1: ffbc8d731049da3eb2efc055e086d1bcd779517b
options:
  basename: SLPM_662.80
  target_path: build/orig/SLPM_662.80
  base_path: ..
  platform: ps2
  compiler: MWCCPS2

  gp_value: 0x001D05F0
  ld_gp_expression: "0x001D05F0"

  asm_path: asm/main
  src_path: src/main
  build_path: build/main
  asset_path: assets/main
  ld_script_path: build/ld/main.ld
  undefined_funcs_auto_path: build/ld/main.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/ld/main.undefined_syms_auto.txt
  # The pinned starts first, so that a name in config/symbols/main.txt wins
  # over the pinned func_ name (as in lobby.yaml).
  symbol_addrs_path:
    - config/functions/main.txt
    - config/symbols/main.txt
    # the libraries' names, one file per library (exported to the overlays with main.txt)
    - config/symbols/sdk_crt0.txt
    - config/symbols/sdk_libcdvd.txt
    - config/symbols/sdk_libdbc.txt
    - config/symbols/sdk_libdma.txt
    - config/symbols/gcc_libc.txt
    - config/symbols/gcc_libgcc.txt
    - config/symbols/sdk_libgraph.txt
    - config/symbols/sdk_libipu.txt
    - config/symbols/sdk_libkernl.txt
    - config/symbols/gcc_libm.txt
    - config/symbols/sdk_libmc.txt
    - config/symbols/sdk_libpad2.txt
    - config/symbols/sdk_libscf.txt
    - config/symbols/sdk_libvu0.txt
    - config/symbols/sdk_libusbkb.txt
    - config/symbols/sdk_libvib.txt
    - config/symbols/sdk_libmpeg.txt
    - config/symbols/cri_sofdec.txt
    - config/symbols/cri_adx.txt

  find_file_boundaries: False
  o_as_suffix: True
  generated_asm_macros_directory: build/include
  disasm_unknown: True
  make_full_disasm_for_code: True

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  section_order: [.text, .data, .rodata, .bss]
  # Each piece carries its own alignment (tools/sjis_as.py, tools/mwcc_cc.py), so
  # data can be split per C file at any address.
  emit_subalign: False
  ld_align_section_vram_end: False

segments:
  - [0x0, bin, elf_header]
  - name: main
    type: code
    start: 0x280
    vram: 0x100000
    bss_size: 0x11B300
    subsegments:
      - [0x280, asm, sdk/crt0]                 # 0x100000: crt0: __start, _exit, _root (ExitThread)
      - [0x4B0, asm, mw/console]               # 0x100230: tty00: console open/write/read; CodeWarrior-built (16-byte aligned), called by libkernl's stdio glue
      - [0x528, asm, sdk/libcdvd]              # 0x1002A8: PsIIlibcdvd 3000; sceCd*, "Libcdvd bind err"
      - [0x2198, asm, sdk/libdbc]              # 0x101F18: PsIIlibdbc 3030; sceDbc*, "libdbc: bind failed"
      - [0x33E8, asm, sdk/libdma]              # 0x103168: PsIIlibdma 3000; sceDma*, "libdma: sync timeout"
      - [0x3C30, asm, gcc/libc]                # 0x1039B0: the toolchain's newlib libc: abs ... vsprintf
      - [0xFE98, asm, gcc/libgcc]              # 0x10FC18: __muldi3, __divdi3, __moddi3, __udivdi3, __umoddi3 (each with its own __clz_tab), soft double (dpadd, litodp...)
      - [0x12960, asm, sdk/libgraph]           # 0x1126E0: PsIIlibgraph3000; sceGs*
      - [0x13320, asm, sdk/libipu]             # 0x1130A0: PsIIlibipu  3000; IPU and DMA ch.3/4 registers
      - [0x13980, asm, sdk/libkernl/syscall]   # 0x113700: PsIIlibkernl3000: kernel syscall stubs
      - [0x14220, asm, sdk/libkernl/glue]      # 0x113FA0: stdio and newlib glue, interrupt and DMAC enable wrappers
      - [0x14AA0, asm, sdk/libkernl/thread]    # 0x114820: "## internel error in libkernl.a!", SceKerneltopThread, DelayThread
      - [0x15080, asm, sdk/libkernl/deci2]     # 0x114E00: Deci2Call wrappers
      - [0x153D8, asm, sdk/libkernl/kprintf]   # 0x115158: scePrintf and its formatter
      - [0x16640, asm, sdk/libkernl/sif]       # 0x1163C0: SIF commands and RPC: sceSifInitCmd, sceSifInitRpc, sceSifBindRpc, sceSifCallRpc
      - [0x17ED0, asm, sdk/libkernl/fileio]    # 0x117C50: sceOpen ... (SceStdio*Sema)
      - [0x1BB08, asm, sdk/libkernl/iopheap]   # 0x11B888: sceSifInitIopHeap, sceSifAllocIopHeap
      - [0x1C058, asm, sdk/libkernl/loadfile]  # 0x11BDD8: sceSifLoadModule ...
      - [0x1CDB8, asm, sdk/libkernl/iopreset]  # 0x11CB38: sceSifResetIop, sceSifSyncIop, sceSifRebootIop ("rom0:UDNL ")
      - [0x1D098, asm, sdk/libkernl/initsys]   # 0x11CE18: TLB, ExecPS2/LoadExecPS2 wrappers, _InitSys (called by crt0)
      - [0x1E190, asm, sdk/libkernl/alarm]     # 0x11DF10: alarms and timers
      - [0x1FB50, asm, gcc/libm]               # 0x11F8D0: the toolchain's newlib libm; ends with the atan2/sqrt wrappers
      - [0x24928, asm, sdk/libmc]              # 0x1246A8: PsIIlibmc   3031; sceMc*
      - [0x26A78, asm, sdk/libpad2]            # 0x1267F8: PsIIlibpad2 3020; scePad2*
      - [0x27330, asm, sdk/libscf]             # 0x1270B0: PsIIlibscf  3000; "rom0:ROMVER"
      - [0x27A20, asm, sdk/libvu0]             # 0x1277A0: PsIIlibvu0  3000; sceVu0*, ends with the VU0/VIF0 reset
      - [0x28770, asm, mw/overlay]             # 0x1284F0: static constructors and overlay start-up (called by Overlay_Relocate); CodeWarrior-built (16-byte aligned)
      - [0x28850, asm, sdk/libusbkb]           # 0x1285D0: PsIIlibusbkb3020; sceUsbKb*
      - [0x29DB0, asm, sdk/libvib]             # 0x129B30: sceVibGetProfile, sceVibSetActParam
      - [0x29F20, asm, sdk/libmpeg]            # 0x129CA0: MPEG decoder ("[MPEG ERROR]")
      - [0x31640, asm, cri/sofdec]             # 0x1313C0: CRI Sofdec (MWSFD 3.33, M2V, MPS, MPV, SFD, SFH; Sep 2004), CodeWarrior-built (16-byte aligned)
      - [0x58BB0, asm, cri/adx]                # 0x158930: CRI ADX (ADXT 9.34, ADXF, CVFS, SJ, SVM...; Nov 2004), GCC-built (8-byte aligned)
      - [0x79810, c, dma_packets]  # 0x179590: DMA tags and VIF codes, image upload packets
      - [0x7A010, c, dma_queue]  # 0x179D90: the DMA queue and its handlers, image downloads from GS memory
      - [0x7B430, c, texture]  # 0x17B1B0: texture and palette handles (flCreatePaletteHandle)
      - [0x7D6D0, c, texconv]  # 0x17D450: texture sizes and conversion (flPS2ConvertTextureFromContext), swizzle tables
      - [0x7EB60, c, vram_slots]
      - [0x7F570, c, screen_tex]
      - [0x800A0, c, mem_util]     # 0x17FE20: byte fill/copy, heap wrappers
      - [0x80330, c, packet_tim2]
      - [0x808c0, c, display]  # 0x180640: display and GS setup at boot (InitDisplay), the VBlank handler
      - [0x80CD0, c, gs_setup]
      - [0x82290, c, packet_mode]
      - [0x822C0, c, iop]  # 0x182040: IOP reboot and module loading
      - [0x826D0, asm, mem_loops]  # 0x182450: Capcom's hand-written copy, clear and fill loops (Mem_*), built from src/main/mem_loops.s
      - [0x828C0, c, main_heap]
      - [0x82950, c, heap]
      - [0x83860, c, image_pixels]
      - [0x83fa0, c, render_state]
      - [0x856E0, c, gs_regs]
      - [0x86760, c, gs_tex_regs]
      - [0x86f90, c, display_util]
      - [0x870A0, c, prim]
      - [0x89FC0, c, power_off]
      - [0x8a210, c, cri_setup]
      - [0x8A2B0, c, pad]
      - [0x8B260, c, pad_port]
      - [0x8C560, c, tim2_file]
      - [0x8ce90, c, main]  # 0x18CC10: main, the file systems, file loading by id, LoadOverlay
      - [0x8d620, c, save_helpers]
      - [0x8EE20, c, sound]          # 0x18EBA0: the game's sound manager (bank slots, SE requests)
      - [0x8FE20, c, cse_spumap]     # 0x18FBA0: CSE SPU memory map (SPUMAPDT)
      - [0x90170, c, cse_rpc]        # 0x18FEF0: CSE SIF RPC client (COMM, STAT, THMN)
      - [0x90630, c, cse]            # 0x1903B0: CSE API, SE tables, the game's sound calls
      - [0x912B0, c, cse_bank]       # 0x191030: CSE bank table
      - [0x91BF0, c, cse_bankfile]   # 0x191970: CSE bank file (Head/Prog/Smpl/Vagi)
      - [0x922A0, c, ml_rpc_queue]   # 0x192020: mlRpcQueue (request queue)
      - [0x92710, c, cse_cmd]        # 0x192490: CSE requests (COMM commands)
      - [0x93160, c, adx_init]
      - [0x93360, c, file_queue]
      - [0x93A20, c, stream_play]
      - [0x94300, c, afs_files]
      - [0x94AB0, c, sound_effects]
      - [0x954b0, c, sound_banks]
      - [0x95E80, data, data]            # .data (0x195C00)
      - [0xBA390, .data, dma_queue]
      - [0xBA3D0, .data, texconv]
      - [0xBAC10, .data, screen_tex]
      - [0xBAC90, .data, gs_setup]
      - [0xBAD20, .data, iop]
      - [0xBADB0, .data, gs_tex_regs]
      - [0xBAE30, .data, prim]
      - [0xBB260, .data, pad]
      - [0xBB270, .data, pad_port]
      - [0xBB3B0, .data, main]
      - [0xBB3C0, .data, save_helpers]
      - [0xBBC60, .data, sound]
      - [0xBCF00, .data, cse_rpc]
      - [0xBCF18, .data, cse]
      - [0xBCF20, .data, ml_rpc_queue]
      - [0xBCF30, .data, adx_init]
      - [0xBCF80, .data, stream_play]
      - [0xBD090, .data, afs_files]
      - [0xBD0A0, .data, sound_effects]
      - { start: 0xBD100, type: data, name: rodata, linker_section_order: .rodata }  # .rodata (0x1BCE80)
      - [0xC7D90, .rodata, dma_queue]
      - [0xC7DF0, .rodata, texture]
      - [0xC7E70, .rodata, texconv]
      - [0xC7EB0, .rodata, screen_tex]
      - [0xC7F78, .rodata, gs_setup]
      - [0xC7FB0, .rodata, iop]
      - [0xC80E0, .rodata, render_state]
      - [0xC8120, .rodata, gs_regs]
      - [0xC8168, .rodata, power_off]
      - [0xC8190, .rodata, pad]
      - [0xC81E0, .rodata, main]
      - [0xC8260, .rodata, save_helpers]
      - [0xC82B8, .rodata, cse_spumap]
      - [0xC83B8, .rodata, cse_rpc]
      - [0xC8468, .rodata, cse]
      - [0xC84F8, .rodata, cse_bank]
      - [0xC8548, .rodata, cse_bankfile]
      - [0xC85F8, .rodata, ml_rpc_queue]
      - [0xC86D8, .rodata, cse_cmd]
      - [0xC8770, .rodata, adx_init]
      - [0xC87B0, .rodata, afs_files]
      - { type: bss, vram: 0x1C8600, name: bss }
  - [0xC8880, bin, elf_tail]
  - [0xC8C60]
