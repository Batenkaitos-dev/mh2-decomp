# splat config for overlay 7, dnas_net.bin (DNAS2 authentication (network)).
# CodeWarrior MWo3 overlay from DATA.BIN entry 1, loaded at 0xAC8000
# including its 0x40-byte header, so text starts at 0xAC8040.
name: dnas_net.bin
sha1: c5ebc39c20ee3114983fabe62a228ff70939477e
options:
  basename: dnas_net
  target_path: build/orig/dnas_net.bin
  base_path: ../..
  platform: ps2
  compiler: MWCCPS2

  asm_path: asm/dnas_net
  src_path: src/dnas_net
  build_path: build/dnas_net
  asset_path: assets/dnas_net
  ld_script_path: build/ld/dnas_net.ld
  undefined_funcs_auto_path: build/ld/dnas_net.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/ld/dnas_net.undefined_syms_auto.txt
  symbol_addrs_path:
    - build/symbols/main.extern.txt
    - build/symbols/sub_main.extern.txt
    - config/symbols/dnas_net.txt

  find_file_boundaries: False
  o_as_suffix: True
  generated_asm_macros_directory: build/include
  disasm_unknown: True
  make_full_disasm_for_code: True

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  section_order: [.text, .data, .rodata, .bss]
  # Each piece carries its own alignment (tools/sjis_as.py, tools/mwcc_cc.py), so
  # data can be split per C file at any address.
  emit_subalign: False
  ld_align_section_vram_end: False

segments:
  - [0x0, bin, header]
  - name: dnas_net
    type: code
    start: 0x40
    vram: 0xAC8040
    bss_size: 0x81300
    subsegments:
      - [0x40, textbin, sdk/dnas2]  # Sony DNAS2 library, partly encrypted (decrypted at runtime); kept as binary
      - [0x70480, data, data]
      - { type: bss, vram: 0xB58B00, name: bss }
  - [0x90B00]
