# splat config for overlay 3, game.bin (in-field (hunting)).
# CodeWarrior MWo3 overlay from DATA.BIN entry 1, loaded at 0x6AF200
# including its 0x40-byte header, so text starts at 0x6AF240.
name: game.bin
sha1: 74e0e4b80b0a2dc133d839c866ef7f0dd5e8ee12
options:
  basename: game
  target_path: build/orig/game.bin
  base_path: ../..
  platform: ps2
  compiler: MWCCPS2

  asm_path: asm/game
  src_path: src/game
  build_path: build/game
  asset_path: assets/game
  ld_script_path: build/ld/game.ld
  undefined_funcs_auto_path: build/ld/game.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/ld/game.undefined_syms_auto.txt
  symbol_addrs_path:
    - build/symbols/main.extern.txt
    - build/symbols/sub_main.extern.txt
    - config/symbols/game.txt
    - config/symbols/game_em.txt
    - config/functions/game.txt

  find_file_boundaries: False
  o_as_suffix: True
  generated_asm_macros_directory: build/include
  disasm_unknown: True
  make_full_disasm_for_code: True

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  section_order: [.text, .data, .rodata, .bss]
  # Each piece carries its own alignment (tools/sjis_as.py, tools/mwcc_cc.py), so
  # data can be split per C file at any address.
  emit_subalign: False
  ld_align_section_vram_end: False

segments:
  - [0x0, bin, header]
  - name: game
    type: code
    start: 0x40
    vram: 0x6AF240
    bss_size: 0xB00
    subsegments:
      - [0x40, asm, text]
      - [0x80, c, weapon_states]      # 0x6AF280: starts with game_entry
      - [0xC7D0, c, horn_gunlance_bow]
      - [0x188E0, c, bowgun_shot]   # 0x6C7AE0: BowgunShot_* and EffEm07_*
      - [0x1BBF0, c, em_ranged_attack]  # 0x6CADF0: EffEm08_*, level 4
      - [0x237F0, c, explosion]     # 0x6D29F0: Eff09_* and Eff10_*
      - [0x24950, c, attack_families]
      - [0x31450, c, elder_attacks]  # 0x6E0650: Eff28_* to EffYamatsukami31_*
      - [0x34900, c, em_effect_attack]  # 0x6E3B00: EffEm33_*, level 4
      - [0x3B020, c, shakalaka_teostra_bulldrome]  # 0x6EA220: EffShakalaka34_*, EffKushala30b_*, EffEm02_*
      - [0x3BE60, c, volcano_hazard]  # 0x6EB060: object state handlers (two jump tables)
      - [0x3C390, c, gunlance_blast]
      - [0x3D8A0, c, area_objects]
      - [0x49810, c, area_scenery]
      - [0x50430, c, em_sight]      # 0x6FF630-0x701810: compiled at optimization level 4
      - [0x52610, c, em_common]
      - [0x585A0, c, em_status]     # 0x7077A0: monster status effects and helpers
      - [0x59650, c, em_helpers]    # 0x708850: monster hit points, motions, sound effects at bones
      - [0x5B090, c, player_states]
      - [0x84990, c, em_script_set]  # 0x733B90: small accessors of an object's tables
      - [0x84CA0, c, player_hit]
      - [0x86BB0, c, em_drome]        # 0x735DB0: Velocidrome, Gendrome, Iodrome (kinds 0x1B, 0x1C, 0x1F)
      - [0x8DE60, c, em_kind1d]             # 0x73D060: kind 0x1D
      - [0x8E580, c, em_kirin]              # 0x73D780: Kirin (0x21)
      - [0x92980, c, em_garuga]       # 0x741B80: Yian Garuga (0x28)
      - [0xA2BD0, c, em_hermitaur]    # 0x751DD0: Daimyo Hermitaur, Shogun Ceanataur (0x30, 0x43)
      - [0xB2B50, c, em_gravios]      # 0x761D50: Gravios, Black Gravios, Basarios (0x11, 0x2F, 0x16)
      - [0xC1200, c, em_felyne_cart]        # 0x770400: the Felyne cart (0x12)
      - [0xC1DC0, c, em_vespoid]            # 0x770FC0: Vespoid (0x13)
      - [0xC5B80, c, em_kutku]        # 0x774D80: Yian Kut-Ku, Gypceros and subspecies (6, 0x26, 0x14, 0x27)
      - [0xD9350, c, em_plesioth]     # 0x788550: Plesioth, Green Plesioth (0x15, 0x2E)
      - [0xE6FE0, c, em_trader]             # 0x7961E0: the trader (0xA)
      - [0xEA170, c, em_apceros]            # 0x799370: Apceros, Popo (0x19, 0x46)
      - [0xEFFA0, c, em_diablos]      # 0x79F1A0: Diablos, Monoblos and subspecies (0xE, 0x2B, 0x1A, 0x2C)
      - [0xFD3C0, c, em_khezu]        # 0x7AC5C0: Khezu, Red Khezu (0xF, 0x2D)
      - [0x10AA00, c, em_velociprey]        # 0x7B9C00: Velociprey, Genprey, Ioprey, Giaprey (0x10, 0xD, 0x1E, 0x23)
      - [0x112170, c, em_anteka]            # 0x7C1370: Anteka, Kelbi (0x45, 3)
      - [0x116150, c, em_mosswine]          # 0x7C5350: Mosswine, Bullfango (4, 5)
      - [0x118EB0, c, em_laoshan]     # 0x7C80B0: Lao-Shan Lung and Ashen (7, 0x32)
      - [0x1236E0, c, em_cephadrome]  # 0x7D28E0: Cephadrome, Cephalos (8, 0x22)
      - [0x12FF70, c, em_melynx]            # 0x7DF170: Melynx (0x17)
      - [0x135470, c, em_rathalos]    # 0x7E4670: Rathian, Rathalos and subspecies (1, 0xB, 0x25, 0x29, 0x2A, 0x31)
      - [0x14AA50, c, em_fatalis]     # 0x7F9C50: Fatalis (2, 0x24, 0x47)
      - [0x155300, c, em_blangonga]   # 0x804500: Blangonga, Congalala, Rajang (0x33, 0x34, 0x35)
      - [0x16BC00, c, em_shengaoren_states] # 0x81AE00: Shen Gaoren's state changes
      - [0x16C0A0, c, em_kushala_states] # 0x81B2A0: Kushala Daora's wind, state changes, curves
      - [0x16D2E0, c, em_shengaoren]  # 0x81C4E0: Shen Gaoren (0x37)
      - [0x179000, c, em_kushala]     # 0x828200: Kushala Daora, Lunastra, Teostra (0x36, 0x3C, 0x40, 0x41)
      - [0x189EA0, c, em_kind38]            # 0x8390A0: kind 0x38
      - [0x18C890, c, em_shakalaka]         # 0x83BA90: Shakalaka (0x39)
      - [0x1910F0, c, em_yamatsukami] # 0x8402F0: Yama Tsukami (0x3A, 0x48)
      - [0x19AAD0, c, em_chameleos]   # 0x849CD0: Chameleos (0x3B)
      - [0x1A4520, c, em_remobra]     # 0x853720: Remobra (0x3F)
      - [0x1A8630, c, em_chameleos_states] # 0x857830: Chameleos's state changes, curves, invisibility
      - [0x1A9810, c, em_bulldrome]   # 0x858A10: Bulldrome (0x44)
      - [0x1AD3F0, c, em_fatalis_states] # 0x85C5F0: Fatalis's state changes and curves
      - [0x1AE120, c, stage_objects]    # 0x85D320: stage objects, effect particles, item props
      - [0x1B8F10, c, hit_effects]
      - [0x1C5990, c, dust_flash_effects]
      - [0x1D1B50, c, monster_effects]
      - [0x1DF560, c, player_effects]
      # the zeros from StageObj_BowArc_Create's end to .data (0x895300): with the last function
