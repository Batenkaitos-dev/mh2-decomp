# splat config for overlay 3, game.bin (in-field (hunting)).
# CodeWarrior MWo3 overlay from DATA.BIN entry 1, loaded at 0x6AF200
# including its 0x40-byte header, so text starts at 0x6AF240.
name: game.bin
sha1: 74e0e4b80b0a2dc133d839c866ef7f0dd5e8ee12
options:
  basename: game
  target_path: build/orig/game.bin
  base_path: ../..
  platform: ps2
  compiler: MWCCPS2

  asm_path: asm/game
  src_path: src/game
  build_path: build/game
  asset_path: assets/game
  ld_script_path: build/ld/game.ld
  undefined_funcs_auto_path: build/ld/game.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/ld/game.undefined_syms_auto.txt
  symbol_addrs_path:
    - build/symbols/main.extern.txt
    - build/symbols/sub_main.extern.txt
    - config/symbols/game.txt
    - config/symbols/game_em.txt
    - config/functions/game.txt

  find_file_boundaries: False
  o_as_suffix: True
  generated_asm_macros_directory: build/include
  disasm_unknown: True
  make_full_disasm_for_code: True

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  section_order: [.text, .data, .rodata, .bss]
  # Each piece carries its own alignment (tools/sjis_as.py, tools/mwcc_cc.py), so
  # data can be split per C file at any address.
  emit_subalign: False
  ld_align_section_vram_end: False

segments:
  - [0x0, bin, header]
  - name: game
    type: code
    start: 0x40
    vram: 0x6AF240
    bss_size: 0xB00
    subsegments:
      - [0x40, asm, text]
      - [0x80, c, unk_6AF280]         # 0x6AF280: starts with game_entry
      - [0xC7D0, c, unk_6BB9D0]
      - [0x188E0, c, unk_6C7AE0]    # 0x6C7AE0: Eff06_* and EffEm07_*
      - [0x1BBF0, c, unk_6CADF0]    # 0x6CADF0: EffEm08_*, level 4
      - [0x237F0, c, unk_6D29F0]    # 0x6D29F0: Eff09_* and Eff10_*
      - [0x24950, c, unk_6D3B50]
      - [0x31450, c, unk_6E0650]    # 0x6E0650: Eff28_* to EffYamatsukami31_*
      - [0x34900, c, unk_6E3B00]    # 0x6E3B00: EffEm33_*, level 4
      - [0x3B020, c, unk_6EA220]    # 0x6EA220: EffShakalaka34_*, EffKushala30b_*, EffEm02_*
      - [0x3BE60, c, unk_6EB060]    # 0x6EB060: object state handlers (two jump tables)
      - [0x3C390, c, unk_6EB590]
      - [0x3D480, c, unk_6EC680]
      - [0x49810, c, unk_6F8A10]
      - [0x50430, c, unk_6FF630]    # 0x6FF630-0x701810: compiled at optimization level 4
      - [0x52610, c, unk_701810]
      - [0x585A0, c, unk_7077A0]    # 0x7077A0: monster status effects and helpers
      - [0x59650, c, unk_708850]    # 0x708850: monster hit points, motions, sound effects at bones
      - [0x5B090, c, unk_70A290]
      - [0x84990, c, unk_733B90]    # 0x733B90: small accessors of an object's tables
      - [0x84CA0, c, unk_733EA0]
      - [0x874B0, c, em_drome]        # 0x7366B0: Velocidrome, Gendrome, Iodrome (kinds 0x1B, 0x1C, 0x1F)
      - [0x95230, c, em_garuga]       # 0x744430: Yian Garuga (0x28)
      - [0xA9250, c, em_hermitaur]    # 0x758450: Daimyo Hermitaur, Shogun Ceanataur (0x30, 0x43)
      - [0xB5BE0, c, em_gravios]      # 0x764DE0: Gravios, Black Gravios, Basarios (0x11, 0x2F, 0x16)
      - [0xC8A30, c, em_kutku]        # 0x777C30: Yian Kut-Ku, Gypceros and subspecies (6, 0x26, 0x14, 0x27)
      - [0xDADE0, c, em_plesioth]     # 0x789FE0: Plesioth, Green Plesioth (0x15, 0x2E)
      - [0xF2450, c, em_diablos]      # 0x7A1650: Diablos, Monoblos and subspecies (0xE, 0x2B, 0x1A, 0x2C)
      - [0xFF200, c, em_khezu]        # 0x7AE400: Khezu, Red Khezu (0xF, 0x2D)
      - [0x11C0D0, c, em_laoshan]     # 0x7CB2D0: Lao-Shan Lung and Ashen (7, 0x32)
      - [0x1251D0, c, em_cephadrome]  # 0x7D43D0: Cephadrome, Cephalos (8, 0x22)
      - [0x138040, c, em_rathalos]    # 0x7E7240: Rathian, Rathalos and subspecies (1, 0xB, 0x25, 0x29, 0x2A, 0x31)
      - [0x15DBF0, c, em_blangonga]   # 0x80CDF0: Blangonga, Congalala, Rajang (0x33, 0x34, 0x35)
      - [0x173D00, c, em_shengaoren]  # 0x822F00: Shen Gaoren (0x37)
      - [0x17DCE0, c, em_kushala]     # 0x82CEE0: Kushala Daora, Lunastra, Teostra (0x36, 0x3C, 0x40, 0x41)
      - [0x195510, c, em_yamatsukami] # 0x844710: Yama Tsukami (0x3A, 0x48)
      - [0x19CB60, c, em_chameleos]   # 0x84BD60: Chameleos (0x3B)
      - [0x1ACD00, c, em_bulldrome]   # 0x85BF00: Bulldrome (0x44) and what follows
      - [0x1B8F10, c, unk_868110]
      - [0x1C5990, c, unk_874B90]
      - [0x1D1B50, c, unk_880D50]
      - [0x1DF560, c, unk_88E760]
      # the zeros from StageObj_BowArc_Create's end to .data (0x895300): with the last function
      # in C they are a piece of their own
      - { start: 0x1E60A0, type: data, name: text_end, linker_section_order: .text }
      - [0x1E6100, .data, unk_6AF280]
