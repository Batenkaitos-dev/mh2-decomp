# splat config for overlay 4, lobby.bin (online lobby and KDDI portal).
# CodeWarrior MWo3 overlay from DATA.BIN entry 1, loaded at 0x6AF200
# including its 0x40-byte header, so text starts at 0x6AF240.
name: lobby.bin
sha1: ed82c6fc62eb5c0cbeb71f370626c7bb91a00ced
options:
  basename: lobby
  target_path: build/orig/lobby.bin
  base_path: ../..
  platform: ps2
  compiler: MWCCPS2

  asm_path: asm/lobby
  src_path: src/lobby
  build_path: build/lobby
  asset_path: assets/lobby
  ld_script_path: build/ld/lobby.ld
  undefined_funcs_auto_path: build/ld/lobby.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/ld/lobby.undefined_syms_auto.txt
  symbol_addrs_path:
    - build/symbols/main.extern.txt
    - build/symbols/sub_main.extern.txt
    - config/functions/lobby.txt
    # after the pinned starts, so that a name given to a pinned function wins
    - config/symbols/lobby.txt
    - config/symbols/lobby_village2.txt
    - config/symbols/lobby_online.txt
    - config/symbols/lobby_browser.txt

  find_file_boundaries: False
  o_as_suffix: True
  generated_asm_macros_directory: build/include
  disasm_unknown: True
  make_full_disasm_for_code: True

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  section_order: [.text, .data, .rodata, .bss]
  # Each piece carries its own alignment (tools/sjis_as.py, tools/mwcc_cc.py), so
  # data can be split per C file at any address.
  emit_subalign: False
  ld_align_section_vram_end: False

segments:
  - [0x0, bin, header]
  - name: lobby
    type: code
    start: 0x40
    vram: 0x6AF240
    bss_size: 0xB0E80
    subsegments:
      - [0x40, asm, text]           # the 0x40 zero bytes every overlay's text starts with
      - [0x80, c, unk_6AF280]       # 0x6AF280: starts with lobby_entry
      - [0x250, c, unk_6AF450]  # automatch: 1 of 1
      - [0x2f0, c, unk_6AF4F0]
