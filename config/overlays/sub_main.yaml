# splat config for overlay 1, sub_main.bin (core: main loop and game systems).
# CodeWarrior MWo3 overlay from DATA.BIN entry 1, loaded at 0x2E3900
# including its 0x40-byte header, so text starts at 0x2E3940.
name: sub_main.bin
sha1: f937e8e4b365bdcc420111b26220a3847d8a21ed
options:
  basename: sub_main
  target_path: build/orig/sub_main.bin
  base_path: ../..
  platform: ps2
  compiler: MWCCPS2

  asm_path: asm/sub_main
  src_path: src/sub_main
  build_path: build/sub_main
  asset_path: assets/sub_main
  ld_script_path: build/ld/sub_main.ld
  undefined_funcs_auto_path: build/ld/sub_main.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/ld/sub_main.undefined_syms_auto.txt
  symbol_addrs_path:
    - build/symbols/main.extern.txt
    - config/symbols/sub_main.txt
    - config/functions/sub_main.txt

  find_file_boundaries: False
  o_as_suffix: True
  generated_asm_macros_directory: build/include
  disasm_unknown: True
  make_full_disasm_for_code: True

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  section_order: [.text, .data, .rodata, .bss]
  # Each piece carries its own alignment (tools/sjis_as.py, tools/mwcc_cc.py), so
  # data can be split per C file at any address.
  emit_subalign: False
  ld_align_section_vram_end: False

segments:
  - [0x0, bin, header]
  - name: sub_main
    type: code
    start: 0x40
    vram: 0x2E3940
    bss_size: 0x1FD900
    subsegments:
      - [0x40, asm, text]           # the 0x40 zero bytes (16 nops) every overlay's text starts with
      - [0x80, c, engine_core]      # 0x2E3980
      - [0xB720, c, bones]          # 0x2EF020: the bones (Bone_*), another unit than func_002E5780's
      - [0xDEC0, c, vu1_packets]
      - [0x128D0, c, skel_file]     # 0x2F61D0
      - [0x12C40, c, model_file]    # 0x2F6540
      - [0x16480, asm, access/unk_2F9D80]   # 0x2F9D80: ACCESS's kana-kanji engine, to 0x305E60 (assembly from your copy)
      - [0x17490, asm, access/unk_2FAD90]   # 0x2FAD90: command builders for the interpreter at 0x2F9D80
      - [0x177C0, asm, access/unk_2FB0C0]
      - [0x1A8F0, asm, access/unk_2FE1F0]   # 0x2FE1F0
      - [0x1AE90, asm, access/unk_2FE790]   # 0x2FE790
      - [0x1BC10, asm, access/unk_2FF510]
      - [0x1F810, asm, access/unk_303110]   # 0x303110
      - [0x205F0, asm, access/unk_303EF0]
      - [0x22560, c, ave_wrap]      # 0x305E60: NETWORK: AVE TCP wrapper RPC client
      - [0x23CC0, c, net_if]        # 0x3075C0: NETWORK: connection layer and NetTcp_*
      - [0x252C0, c, net_front]
      - [0x2AB20, c, net_arena]     # 0x30E420
      - [0x2B130, c, kbd_input]     # 0x30EA30 (Arena_Realloc, 0x30E8F0, is net_arena.c's)
      - [0x311D0, c, kbd_cand_box]  # 0x314AD0: Kbd_DrawCandidateBox, level 4
      - [0x31500, c, kbd]           # 0x314E00
      - [0x36C80, c, camera]        # 0x31A580: CamCtl_Clear, level 4
      - [0x38EE0, c, cam_modes]
      - [0x3A670, c, cam_request]   # 0x31DF70
      - [0x3A890, c, cam_control]
      - [0x40390, c, cam_small_requests]  # 0x323C90: requests to the state machine at 0x31E080
      - [0x407E0, c, scene]
      - [0x453D0, c, area_collision]
      - [0x4D940, c, combine]       # 0x331240: item combination (recipes, success rate)
      - [0x4F370, c, lights]
