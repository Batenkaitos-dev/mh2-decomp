      - [0xCE050, c, pouch]         # 0x3B1950: the player's item pouch
      - [0xD1380, c, equip_save]    # 0x3B4C80: the player (item use, ...)
      - [0xDA760, c, hit_detection]  # 0x3BE060: segment and sphere geometry, then ObjAttach
      - [0xE6E90, c, bone_effects]  # 0x3CA790: the kind 6 effect objects (Effect06_*)
      - [0xEA0C0, c, part_effects]  # 0x3CD9C0: the kind 0xD effect objects (PartFx_*), level 4
      - [0xEE930, c, lock_on_mark]  # 0x3D2230: the ground effects, then the lobby lock-on mark (LockOnMark_*)
      - [0xEF3B0, c, movie]         # 0x3D2CB0: movie player (Sofdec wrapper)
      - [0xF0800, c, loading_screen]
      - [0xF1BB0, c, card_menu]     # 0x3D54B0: the network menu (helpers, patch loader, states)
      - [0xFA2A0, c, card_task]     # 0x3DDBA0
      - [0xFD5C0, c, em_bones]
      - [0x100400, c, fishing]      # 0x3E3D00: the fishing code
      # the 32 nops from func_003E7E00's end to vu1_microcode (0x3E7F00-0x3E7F80): with
