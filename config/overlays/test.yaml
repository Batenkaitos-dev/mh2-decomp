# splat config for overlay 12, test.bin (all-zero stub).
# CodeWarrior MWo3 overlay from DATA.BIN entry 1, loaded at 0x939600
# including its 0x40-byte header, so text starts at 0x939640.
name: test.bin
sha1: d5fc36414c65918fe87f651ad373e1eb8b15fc3b
options:
  basename: test
  target_path: build/orig/test.bin
  base_path: ../..
  platform: ps2
  compiler: MWCCPS2

  asm_path: asm/test
  src_path: src/test
  build_path: build/test
  asset_path: assets/test
  ld_script_path: build/ld/test.ld
  undefined_funcs_auto_path: build/ld/test.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/ld/test.undefined_syms_auto.txt
  symbol_addrs_path:
    - build/symbols/main.extern.txt
    - build/symbols/sub_main.extern.txt
    - config/symbols/test.txt

  find_file_boundaries: False
  o_as_suffix: True
  generated_asm_macros_directory: build/include
  disasm_unknown: True
  make_full_disasm_for_code: True

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  section_order: [.text, .data, .rodata, .bss]
  # Each piece carries its own alignment (tools/sjis_as.py, tools/mwcc_cc.py), so
  # data can be split per C file at any address.
  emit_subalign: False
  ld_align_section_vram_end: False

segments:
  - [0x0, bin, header]
  - name: test
    type: code
    start: 0x40
    vram: 0x939640
    bss_size: 0x0
    subsegments:
      - [0x40, textbin, text]
  - [0x100]
